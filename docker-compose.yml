services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: guest
      POSTGRES_PASSWORD: guest
      POSTGRES_DB: query_test
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U guest" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
